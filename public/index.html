<!DOCTYPE html>
<!--
  FairDrop — index.html  (LOGIN PAGE)
  Logic lives in js/login.js. Styles live in css/style.css.

  DEVELOPER / AI NOTES
  - reCAPTCHA v2: the <script> below loads Google's official widget.
    The SITE key is NOT written here. login.js fetches it from GET /config,
    which reads RECAPTCHA_SITE_KEY from the backend .env file.
    The SECRET key must NEVER appear in frontend code. Only the backend
    uses it, to verify the token with Google.
  - Form submit is handled in js/login.js -> POST /auth/login (real MySQL).
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FairDrop — Login</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- Official Google reCAPTCHA v2 library -->
  <script src="https://www.google.com/recaptcha/api.js?render=explicit" async defer></script>
</head>
<body>
  <main class="auth-page">

    <!-- Logo / name -->
    <div class="brand">
      <div class="brand-mark">FD</div>
      <div>
        <div class="brand-name">FairDrop</div>
        <div class="brand-sub">FAIR ACCESS • QUEUE SYSTEM</div>
      </div>
    </div>

    <section class="auth-card">
      <div class="eyebrow">WELCOME BACK</div>
      <h1>Log in</h1>
      <p class="muted">Sign in to join the fair queue.</p>

      <form id="loginForm" novalidate>
        <label for="username">Username</label>
        <input id="username" name="username" type="text"
               autocomplete="username" placeholder="your username">

        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               autocomplete="current-password" placeholder="your password">

        <!-- reCAPTCHA v2 checkbox. login.js draws it into #captchaBox
             using the site key from GET /config (set in backend .env). -->
        <div class="captcha-wrap">
          <div class="captcha-label">Human verification</div>
          <div id="captchaBox"></div>
          <div id="captchaHint" class="field-hint">Loading Google reCAPTCHA...</div>
        </div>

        <button id="loginBtn" class="btn-primary" type="submit">Log in</button>
        <div id="message" class="message" role="alert"></div>
      </form>

      <p class="auth-switch">No account? <a href="register.html">Register</a></p>

      <div class="dev-note">
        Accounts are stored in MySQL (table <code>users</code>). Register first,
        then log in with the same account.
      </div>
    </section>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
